{% extends "base.html" %}
{% block title %}QR Code · PyXUI{% endblock %}
{% block content %}

<div class="topbar">
  <div>
    <h1>{{ remark }}</h1>
    <div class="subtitle">Scan to import</div>
  </div>
</div>

<div class="card" style="max-width:360px; text-align:center;">
  <img src="{{ qr }}" alt="QR code" style="max-width:260px; width:100%; background:white; padding:14px; border-radius:10px; margin-bottom:14px;">
  <div class="link-box" onclick="copyText('{{ link }}', 'Link')" style="text-align:left;">{{ link }}</div>
  <a class="btn" href="{{ url_for('dashboard') }}" style="width:100%; justify-content:center; margin-top:14px;">
    <i class="lucide-arrow-left"></i> Back
  </a>
</div>

{% endblock %}

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login · PyXUI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root { --bg:#0b0d12; --panel:#12151d; --border:#232838; --text:#e8eaf0; --text-dim:#8b91a3; --accent:#6d8cff; }
  * { box-sizing: border-box; }
  body { background: var(--bg); color: var(--text); font-family:'Inter',sans-serif; margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; }
  .card { background: var(--panel); border:1px solid var(--border); border-radius:16px; padding:36px; width:100%; max-width:360px; box-shadow:0 8px 40px rgba(0,0,0,.4); }
  .brand { text-align:center; font-weight:700; font-size:20px; margin-bottom:4px; display:flex; align-items:center; justify-content:center; gap:8px; }
  .dot { width:8px; height:8px; border-radius:50%; background:var(--accent); box-shadow:0 0 10px var(--accent); }
  .tagline { text-align:center; color:var(--text-dim); font-size:12.5px; margin-bottom:26px; }
  label { display:block; font-size:13px; color:var(--text-dim); margin-bottom:6px; font-weight:500; }
  input { width:100%; background:#171b26; border:1px solid var(--border); color:var(--text); padding:11px 13px; border-radius:9px; font-size:14px; margin-bottom:16px; font-family:inherit; }
  input:focus { outline:none; border-color:var(--accent); }
  button { width:100%; background:var(--accent); border:none; color:#fff; padding:11px; border-radius:9px; font-weight:600; font-size:14px; cursor:pointer; }
  button:hover { background:#7d99ff; }
  .alert { background:rgba(239,87,87,.12); border:1px solid rgba(239,87,87,.3); color:#ef5757; padding:10px 12px; border-radius:8px; font-size:13px; margin-bottom:16px; }
</style>
</head>
<body>
  <div class="card">
    <div class="brand"><span class="dot"></span> PyXUI</div>
    <div class="tagline">Xray + SSH tunnel management</div>
    {% with messages = get_flashed_messages() %}
      {% for m in messages %}<div class="alert">{{ m }}</div>{% endfor %}
    {% endwith %}
    <form method="post">
      <label>Username</label>
      <input name="username" required autofocus>
      <label>Password</label>
      <input type="password" name="password" required>
      <button type="submit">Sign in</button>
    </form>
  </div>
</body>
</html>

{% extends "base.html" %}
{% block title %}Settings · PyXUI{% endblock %}
{% block content %}

<div class="topbar">
  <div>
    <h1>Settings</h1>
    <div class="subtitle">Server-wide configuration</div>
  </div>
</div>

<div class="card" style="max-width:480px;">
  <form method="post">
    <div class="form-group">
      <label>Domain</label>
      <input name="domain" value="{{ domain }}" required>
    </div>
    <div class="form-group">
      <label>Public port</label>
      <input name="public_port" value="{{ public_port }}" required>
    </div>
    <div class="form-group">
      <label>VLESS WebSocket path</label>
      <input name="vless_ws_path" value="{{ vless_ws_path }}" required>
    </div>
    <div class="form-group">
      <label>VMess WebSocket path</label>
      <input name="vmess_ws_path" value="{{ vmess_ws_path }}" required>
    </div>
    <div class="form-group">
      <label>Trojan WebSocket path</label>
      <input name="trojan_ws_path" value="{{ trojan_ws_path }}" required>
    </div>
    <hr style="border-color:var(--border); margin:20px 0;">
    <div class="form-group">
      <label>Change admin password</label>
      <input type="password" name="new_password" placeholder="leave blank to keep current">
    </div>
    <button class="btn btn-primary" type="submit" style="width:100%; justify-content:center;">
      <i class="lucide-save"></i> Save
    </button>
  </form>
</div>

{% endblock %}

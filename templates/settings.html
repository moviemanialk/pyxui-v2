{% extends "base.html" %}
{% block title %}Settings · PyXUI{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="card p-4">
      <h5 class="mb-3">Server settings</h5>
      <form method="post">
        <div class="mb-3">
          <label class="form-label">Domain</label>
          <input class="form-control" name="domain" value="{{ domain }}" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Public port</label>
          <input class="form-control" name="public_port" value="{{ public_port }}" required>
        </div>
        <div class="mb-3">
          <label class="form-label">VLESS WebSocket path</label>
          <input class="form-control" name="vless_ws_path" value="{{ vless_ws_path }}" required>
        </div>
        <div class="mb-3">
          <label class="form-label">VMess WebSocket path</label>
          <input class="form-control" name="vmess_ws_path" value="{{ vmess_ws_path }}" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Trojan WebSocket path</label>
          <input class="form-control" name="trojan_ws_path" value="{{ trojan_ws_path }}" required>
        </div>
        <hr class="border-secondary">
        <div class="mb-3">
          <label class="form-label">Change admin password</label>
          <input class="form-control" type="password" name="new_password" placeholder="leave blank to keep current">
        </div>
        <button class="btn btn-primary w-100" type="submit">Save</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
